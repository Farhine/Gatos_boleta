/* v1.3 */
:root{--bg:#f4f6f5;--card:#fff;--ink:#14201d;--mute:#64716d;--line:#e3e8e6;--acc:#0b5f52;--acc2:#e1f0ec;--warn:#b93e2c;--warn2:#fbe8e4}

.fab{border-radius:50%;box-shadow:0 6px 16px #0b5f5266;font-weight:300}.btn{border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600}.btn.pri .i{color:inherit}

input,select,textarea{border-radius:12px;background:var(--bg);border-color:transparent}input:focus,select:focus,textarea:focus{outline:2px solid var(--acc)}
.item{padding-top:10px;border-top:1px solid var(--line)}.wrow{display:grid;grid-template-columns:1fr 80px 48px;gap:8px;align-items:center;margin-top:8px}.wrow input{margin:0;text-align:right}.wp{text-align:right;color:var(--mute)}.bar{height:7px}.cols i{border-radius:6px 6px 0 0}

html{overscroll-behavior-y:none}.page{animation:in .14s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
main{padding:0 16px 8px}header{padding:14px 10px 6px 8px;gap:4px;position:sticky;top:0;background:var(--bg);z-index:4}header h1{font-size:21px}.back{display:grid;place-items:center;width:44px;height:44px;border-radius:12px}

.ipills select{grid-column:auto;width:100%}
